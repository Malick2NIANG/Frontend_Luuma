# Un seul port pour tout : l'application, l'API, le temps réel et les
# fichiers. C'est ce qui permet de tester à distance en ne forwardant QUE ce
# port (tunnel VS Code, ngrok…) : le téléphone ne voit jamais 3001 ni 9000.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Photos et vocaux envoyés depuis l'app passent par ici.
  client_max_body_size 50m;

  # ── API REST + better-auth (/api/auth/*) ──────────────────
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # ── Temps réel (chat) : la connexion doit pouvoir passer en WebSocket ──
  location /socket.io/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # ── Fichiers publics (MinIO) : /storage/luum-public/... ───
  location /storage/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host minio:9000;
  }

  # ── Application installable (PWA) ─────────────────────────
  # Le manifeste doit être servi avec son type : nginx ne le connaît pas et
  # renvoyait « application/octet-stream ». (Pas de bloc `types` ici : il
  # remplacerait TOUS les types connus de nginx.)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Le service worker n'est jamais mis en cache : une version figée
  # empêcherait toute mise à jour de l'application installée.
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  # ── Bundle : noms hachés, cache illimité ──────────────────
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ── Application monopage : expo-router gère les routes ────
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
